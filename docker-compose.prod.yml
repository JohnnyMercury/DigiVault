services:
  web:
    image: digivault:latest
    build:
      context: .
      dockerfile: src/DigiVault.Web/Dockerfile
    container_name: digivault-web
    network_mode: "host"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8082
      - ConnectionStrings__DefaultConnection=${DIGIVAULT_CONNECTION_STRING:?}
      - Storage__UseMinIO=true
      - MinIO__Endpoint=localhost:9000
      - MinIO__AccessKey=${MINIO_ACCESS_KEY:?}
      - MinIO__SecretKey=${MINIO_SECRET_KEY:?}
      - MinIO__BucketName=digivault-images
      - MinIO__UseSSL=false
      - MinIO__PublicUrl=${MINIO_PUBLIC_URL:?}
      - MinIO__UseRelativeUrls=true
    volumes:
      - digivault-backups:/app/backups
      # Data Protection key ring — persists antiforgery / Identity cookie
      # encryption keys across container rebuilds. Without this volume every
      # `docker compose up --build` invalidates every active session and
      # antiforgery token, so the first POST after a redeploy returns 400
      # with «The key {guid} was not found in the key ring». Program.cs
      # pins PersistKeysToFileSystem to this exact path.
      - digivault-dataprotection:/app/dataprotection-keys
      # Overpay mTLS client certificate. Drop the .p12 file at
      # /var/www/digivault/secrets/overpay.p12 on the host (chmod 600,
      # owned by the docker user). PaymentProviderConfig.Settings.certPath
      # references this exact path so the named HttpClient picks it up.
      # Read-only mount keeps the container from accidentally rewriting it.
      - /var/www/digivault/secrets:/var/www/digivault/secrets:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  digivault-backups:
    driver: local
  digivault-dataprotection:
    driver: local
